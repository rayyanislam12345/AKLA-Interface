<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKLA Matter Hub</title>
    <meta name="description" content="Internal matter management and AI drafting hub." />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2D3E6E" />

    <!-- iOS "Add to Home Screen": launches full-screen with no Safari
         chrome, and this exact icon/title, instead of a bookmark-styled
         screenshot thumbnail. Standard trio Safari actually reads on iOS —
         the web manifest above is respected by Android/Chrome but iOS
         Safari still wants these separately. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AKLA Hub" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
