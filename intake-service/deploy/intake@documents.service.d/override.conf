[Service]
# The template unit runs "python -m intake %i --sharepoint", which is the agendas' shape.
# The documents command takes no --sharepoint: it reads the WhatsApp Filer's own record
# (read-only) and downloads from SharePoint what that record names.
ExecStart=
ExecStart=/usr/bin/flock -n /tmp/intake-documents.lock /opt/intake-service/venv/bin/python -m intake documents
# Where the Filer keeps its record. This is also the default in intake/filer.py; it is
# written here so the path is in one visible place if the Filer ever moves.
Environment=FILER_DB=/opt/whatsapp-filer/state/filed.sqlite
# 25 downloads and saves fit well inside this; a stuck run is ended before two more slots pass.
TimeoutStartSec=1500
