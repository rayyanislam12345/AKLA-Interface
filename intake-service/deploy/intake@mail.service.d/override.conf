[Service]
# The template unit runs "python -m intake %i --sharepoint", which is wrong for
# this command: mail takes no --sharepoint. Graph (the Filer's app, with the
# Mail.Read consent) comes from /opt/whatsapp-filer/.env and the Claude key
# (ANTHROPIC_API_KEY) from /opt/chat-service/.env, both already listed as
# EnvironmentFile in intake@.service.
ExecStart=
# flock -n so two runs never overlap; -E 0 so a run skipped because the last one
# is still going is not reported as a failure.
ExecStart=/usr/bin/flock -n -E 0 /tmp/intake-mail.lock /opt/intake-service/venv/bin/python -m intake mail
# A run is cut off before the one after next would start; what it had not
# finished is read again by the next run.
TimeoutStartSec=900
