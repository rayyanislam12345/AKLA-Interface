# ---------------------------------------------------------------------------
# The Transactions Hub sheet (added 11 Nov 2026 for the intake service).
#
# An agenda says "Transaction: ADB – M6" or "PTQ – Financing Workstream" or just
# "M6"; the sheet files the same work under a CLIENT and a PROJECT. Each entry
# below is one transaction as the sheet knows it:
#   code      the code above (so the extractor's aliases count too)
#   pairs     the [CLIENT, PROJECT] pairs the sheet uses for it (several when the
#             sheet spells the client two ways, or one client has sister projects)
#   new_row   the pair a brand-new row is created under
#   aliases   extra spellings seen in agendas and timesheets
#   matter_id the Hub project (matters.id) for its rows, when one exists
#   matter_rules  a deliverable whose text matches `contains` goes to another project
# A transaction with no pairs is known but has no sheet rows yet.
hub_clients:
  - code: ADB
    pairs: [["Asian Development Bank", "M6 Motorway"], ["ADB", "M6 Motorway"]]
    new_row: ["Asian Development Bank", "M6 Motorway"]
    matter_id: 9f3184dc-a85f-4fe3-a2a4-2f77cc2420fd
