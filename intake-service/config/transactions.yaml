# Transactions the filer knows. Confirmed 23 Oct 2026 (codes and names checked by Rayyan).
# Built from the codes the firm already uses in AKLA - Data Room (tools/scan_codes.py;
# state/codes.json). For each: the code that starts filed names, the folder under
# Automated Inbox, and other names it goes by (helps Claude recognise it).
# keys: words that, when they appear in a filename, settle the transaction without
#   asking Claude (only if they point to exactly one transaction).
# title_words: the project's own name and place words, ignored (with the keys) when a new
#   title is matched against documents already filed, so "Concession Agreement (M6 Motorway)"
#   and "Concession Agreement - Section I of the Hyderabad Sukkur Motorway (M-6)" land in one
#   folder (added 28 Oct 2026).
# Numbering continues after the highest number already used on SharePoint for
# the code (e.g. Master Mining is at MM75, so the next filed file is MM76).
# Files that belong to none of these are not filed (decided 23 Oct 2026), except CVs,
# which go to Automated Inbox/Recruitment.

matters:
