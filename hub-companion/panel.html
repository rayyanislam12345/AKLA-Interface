<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon" type="button" title="Back" aria-label="Back" disabled>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
    </button>
    <div class="place">
      <span id="kind" class="kind">AKLA Hub</span>
      <span id="title" class="title">No document open</span>
    </div>
    <button id="home" class="icon" type="button" title="Hub home" aria-label="Hub home">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 9 10 3.5 16.5 9M5.5 7.5V16h9V7.5"/></svg>
    </button>
    <button id="tab" class="icon" type="button" title="Open this page in the Hub, in a new tab" aria-label="Open in the Hub">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 4h5v5M16 4l-7 7M14 12v4H4V6h4"/></svg>
    </button>
    <button id="more" class="icon" type="button" title="More" aria-label="More" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4.5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15.5" cy="10" r="1.3"/></svg>
    </button>
    <button id="close" class="icon" type="button" title="Close" aria-label="Close" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15"/></svg>
    </button>
  </header>

  <div id="menu" class="menu" hidden>
    <form id="go" class="go">
      <input id="address" type="text" placeholder="Paste a Hub link" autocomplete="off" spellcheck="false" aria-label="Hub link">
      <button type="submit">Show</button>
    </form>
    <label class="row" for="theme">
      <span>Colours</span>
      <select id="theme" aria-label="Colour theme for the chat and the Hub"></select>
    </label>
    <div class="row pane-only" id="modeRow">
      <span>Beside the chat</span>
      <div class="seg" role="group" aria-label="How the drawer sits">
        <button type="button" data-mode="push">Push</button>
        <button type="button" data-mode="over">Slide over</button>
      </div>
    </div>
    <button id="menuHome" class="item" type="button">Hub home</button>
    <button id="menuTab" class="item" type="button">Open this page in a new tab</button>
    <button id="viewSwitch" class="item" type="button"></button>
    <button id="settings" class="item" type="button">All settings</button>
  </div>

  <p id="notice" class="notice" hidden></p>
  <div id="idle" class="idle" hidden>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="9" y="5" width="22" height="30" rx="2"/><path d="M14 13h12M14 18h12M14 23h8"/></svg>
    <p class="lead">No document open</p>
    <p>When Claude names a Hub document or project, click its link in the chat and it opens here.</p>
    <p class="hint">You can also paste a link from the menu, or go to the Hub's home.</p>
  </div>
  <iframe id="frame" title="AKLA Hub" allow="clipboard-read; clipboard-write" hidden></iframe>
  <script src="links.js"></script>
  <script src="passage.js"></script>
  <script src="themes.js"></script>
  <script src="panel.js"></script>
</body>
</html>
